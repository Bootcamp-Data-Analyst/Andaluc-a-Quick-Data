name: QuickData Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Ajustado a una version estable comun
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest geopandas folium matplotlib pandas
        
    - name: Run tests
      run: |
        pytest
