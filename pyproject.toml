[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quickdata"
version = "0.1.0"
description = "Herramienta para análisis y visualización geoespacial de Andalucía"
readme = "README.md"
authors = [
    {name = "leonkeneddy86", email = "jonathan19.jtv@gmail.com"},
    {name = "Samuelperez15", email = "samuelperezdelgado15@gmail.com"},
    {name = "Frodmar", email = "frodmar212@gmail.com"},
    {name = "DanielCGClase", email = "carrascogonzalezdaniel@gmail.com"},
]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "geopandas>=1.0.0",
    "folium>=0.16.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
